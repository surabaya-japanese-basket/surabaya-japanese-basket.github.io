<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,800&family=Noto+Sans+JP:wght@400;700;900&display=swap" />
<style>
  :root {
    --bg: #ffffff;
    --text: #14201a;
    --muted: #55645b;
    --accent: #178a47;
    --line: #dfeae2;
    --display: 'Barlow Condensed', 'Arial Narrow', 'Noto Sans JP', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    color: var(--text);
    line-height: 1.4;
    overflow: hidden;
    word-break: auto-phrase;
    line-break: strict;
  }
  .card { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }

  /* コートのライン柄 */
  .court { position: absolute; fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0.12; }

  /* 水辺の帯（サメとワニ） */
  .water { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; display: block; }
  .water .w { fill: var(--accent); }
  .water .fin { fill: var(--text); opacity: 0.9; }
  .water .croc { fill: var(--accent); }
  .water .eye { fill: var(--bg); }
  .water .wave { fill: none; stroke: var(--bg); stroke-width: 2.5; stroke-linecap: round; opacity: 0.7; }

  .content { position: absolute; z-index: 2; }
  .badge {
    display: inline-block; background: var(--accent); color: #fff; font-weight: 900;
    border-radius: 999px; line-height: 1.5;
  }
  .wordmark {
    font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase;
    line-height: 0.88; letter-spacing: -0.005em;
  }
  .wordmark em { font-style: italic; color: var(--accent); }
  .badge-en { font-family: var(--display); font-weight: 700; letter-spacing: 0.1em; font-size: 0.78em; margin-left: 0.7em; opacity: 0.92; }
  .name { font-weight: 900; }
  .facts { list-style: none; }
  .facts li { font-weight: 900; display: grid; grid-template-columns: auto 1fr; align-items: center; }
  .facts li::before { content: ''; grid-row: 1; grid-column: 1; background: var(--accent); border-radius: 2px; }
  .facts .ja { grid-row: 1; grid-column: 2; }
  .facts .en-line { grid-row: 2; grid-column: 2; font-weight: 700; color: var(--muted); line-height: 1.3; }
  .cta .lead-en { font-weight: 700; color: var(--muted); }
  .cta { display: flex; align-items: center; }
  .qr { background: #fff; border: 2px solid var(--line); border-radius: 14px; flex: none; }
  .qr svg { display: block; width: 100%; height: 100%; }
  .cta .lead { font-weight: 900; }
  .cta .url { font-family: var(--display); font-weight: 700; color: var(--accent); letter-spacing: 0.01em; }
  .cta .ig { color: var(--muted); font-weight: 700; }

  /* ===== OGP 1200x630 ===== */
  body.og { width: 1200px; height: 630px; }
  .og .court { right: -120px; top: -60px; width: 700px; height: 700px; }
  .og .water { height: 180px; }
  .og .content { left: 64px; top: 44px; right: 64px; bottom: 150px; display: grid; grid-template-columns: 1fr 250px; column-gap: 40px; align-items: center; }
  .og .badge { font-size: 26px; padding: 2px 22px; margin-bottom: 14px; }
  .og .wordmark { font-size: 96px; }
  .og .b2, .square .b2 { display: none; }
  .og .name { font-size: 32px; margin: 10px 0 6px; }
  .og .facts li { font-size: 27px; margin-top: 2px; }
  .og .facts li::before { width: 14px; height: 14px; margin-right: 12px; }
  .og .facts .en-line { font-size: 20px; }
  .og .cta .lead-en { font-size: 16px; }
  .og .cta { flex-direction: column; align-items: center; text-align: center; gap: 10px; }
  .og .qr { width: 220px; height: 220px; padding: 14px; }
  .og .cta .lead { font-size: 22px; }
  .og .cta .url, .og .cta .ig { display: none; }

  /* ===== 正方形 1080x1080 (Instagram / LINE) ===== */
  body.square { width: 1080px; height: 1080px; }
  .square .court { right: -200px; top: -80px; width: 900px; height: 900px; }
  .square .water { height: 150px; }
  .square .content { left: 72px; right: 72px; top: 64px; bottom: 170px; display: flex; flex-direction: column; justify-content: space-between; }
  .square .badge { font-size: 36px; padding: 4px 30px; align-self: flex-start; }
  .square .wordmark { font-size: 134px; margin-top: 18px; }
  .square .name { font-size: 44px; margin-top: 14px; }
  .square .facts li { font-size: 40px; margin-top: 6px; }
  .square .facts li::before { width: 18px; height: 18px; margin-right: 16px; }
  .square .facts .en-line { font-size: 26px; }
  .square .cta .lead-en { font-size: 24px; }
  .square .cta { gap: 28px; }
  .square .qr { width: 200px; height: 200px; padding: 14px; }
  .square .cta .lead { font-size: 32px; }
  .square .cta .url { font-size: 38px; margin-top: 2px; }
  .square .cta .ig { font-size: 26px; margin-top: 2px; }

  /* ===== ストーリー 1080x1920 (Instagram Story) ===== */
  body.story { width: 1080px; height: 1920px; }
  .story .court { right: -260px; top: 120px; width: 1000px; height: 1000px; }
  .story .water { height: 196px; }
  /* 上下はUIが重なるので安全余白を取る */
  .story .content { left: 80px; right: 80px; top: 260px; bottom: 340px; display: flex; flex-direction: column; justify-content: space-between; }
  .story .badge { font-size: 42px; padding: 6px 36px; align-self: flex-start; }
  .story .wordmark { font-size: 230px; margin-top: 24px; }
  .story .name { font-size: 54px; margin-top: 24px; }
  .story .facts li { font-size: 48px; margin-top: 10px; }
  .story .facts li::before { width: 22px; height: 22px; margin-right: 20px; }
  .story .facts .en-line { font-size: 31px; }
  .story .cta .lead-en { font-size: 28px; }
  .story .cta { gap: 36px; }
  .story .qr { width: 260px; height: 260px; padding: 18px; }
  .story .cta .lead { font-size: 40px; }
  .story .cta .url { font-size: 44px; margin-top: 4px; }
  .story .cta .ig { font-size: 32px; margin-top: 4px; }
</style>
</head>
<body class="{{LAYOUT}}">
<div class="card">
  <svg class="court" viewBox="0 0 640 640" aria-hidden="true">
    <circle cx="400" cy="320" r="190"></circle>
    <circle cx="400" cy="320" r="64"></circle>
    <line x1="400" y1="0" x2="400" y2="640"></line>
    <rect x="400" y="230" width="240" height="180"></rect>
    <path d="M400 130 A 190 190 0 0 1 400 510"></path>
  </svg>

  <div class="content">
    <div class="main">
      <p class="badge">メンバー募集中<span class="badge-en">PLAYERS WANTED</span></p>
      <h1 class="wordmark">SURABAYA<br />JAPANESE<br class="b2" /> <em>BASKET</em></h1>
      <p class="name">スラバヤ日本人会バスケ部</p>
      <ul class="facts">
        <li><span class="ja">毎週土曜 16:00〜18:00</span><span class="en-line">Every Saturday, 4:00–6:00 PM</span></li>
        <li><span class="ja">初心者〜経験者 歓迎</span><span class="en-line">Beginners to experienced welcome</span></li>
      </ul>
    </div>
    <div class="cta">
      <div class="qr">{{QR}}</div>
      <div class="text">
        <p class="lead">参加・詳細はこちら</p>
        <p class="lead-en">Details &amp; how to join</p>
        <p class="url">{{URL_SHORT}}</p>
        <p class="ig">Instagram @surabayajapanesebasket</p>
      </div>
    </div>
  </div>

  <svg class="water" viewBox="0 0 640 96" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <rect class="w" x="0" y="58" width="640" height="38"></rect>
    <path class="fin" d="M496 60 C 512 56 524 38 534 8 C 540 32 556 52 576 60 Z"></path>
    <rect class="croc" x="84" y="48" width="104" height="14" rx="7"></rect>
    <circle class="croc" cx="92" cy="46" r="3.6"></circle>
    <circle class="croc" cx="154" cy="43" r="6.5"></circle>
    <circle class="croc" cx="174" cy="43" r="6.5"></circle>
    <circle class="eye" cx="154" cy="42" r="2"></circle>
    <circle class="eye" cx="174" cy="42" r="2"></circle>
    <path class="wave" d="M0 60 Q 20 54 40 60 T 80 60 T 120 60 T 160 60 T 200 60 T 240 60 T 280 60 T 320 60 T 360 60 T 400 60 T 440 60 T 480 60 T 520 60 T 560 60 T 600 60 T 640 60"></path>
  </svg>
</div>
</body>
</html>
